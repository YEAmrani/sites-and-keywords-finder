services:
  searxng:
    image: searxng/searxng:latest
    container_name: site-finder-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=Site Finder SearXNG

